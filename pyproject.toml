[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-ophys-utils"
description = "Generated from aind-library-template"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
dynamic = ["version"]

dependencies = [
    'h5py>=3.11',
    'imageio-ffmpeg>=0.5',
    'matplotlib>=3.9',
    'pandas>=2.2.2',
    'scikit-image>=0.24',
    'scipy>=1.11',
    'statsmodels>=0.14.2'
]

[project.optional-dependencies]
# optional backends: jax for nonlinear_fit(backend="jax"), torch for
# summary_images and noise_std(method="fft", device=...)
jax = ['jax>=0.4.26']
torch = ['torch>=2.3']
dev = [
    'jax>=0.4.26',
    'torch>=2.3',
    'coverage',
    'interrogate',
    'mkdocs',
    'mkdocs-material',
    'mkdocstrings[python]',
    'ruff',
    'pytest'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aind_ophys_utils.__version__"}

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/aind_ophys_utils/signal_utils.py" = ["C901"]

[tool.coverage.run]
omit = ["*__init__*"]
source = ["aind_ophys_utils", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "from",
    "import",
    "pragma: no cover"
]
fail_under = 100

[tool.interrogate]
exclude = ["setup.py", "docs", "build"]
fail-under = 100
